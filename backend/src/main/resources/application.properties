spring.application.name=grmr

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/grmr}
spring.datasource.username=${DATASOURCE_USERNAME:grmr}
spring.datasource.password=${DATASOURCE_PASSWORD:grmr}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Dev-only default. Override JWT_SECRET in real environments (min 32 bytes for HS256).
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-before-deploying-anywhere}
jwt.access-token-expiration-millis=3600000
jwt.refresh-token-expiration-millis=1209600000
