# Only loaded when the "local" Spring profile is active.
# Values come from the environment. If any is blank, LocalAdminSeeder fails fast at startup
# with a clear local-only configuration error instead of silently skipping.
local.admin.login-id=${LOCAL_ADMIN_LOGIN_ID:}
local.admin.password=${LOCAL_ADMIN_PASSWORD:}
local.admin.name=${LOCAL_ADMIN_NAME:}
