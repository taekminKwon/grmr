# Only loaded when the "local" Spring profile is active.
# Values come from the environment. If any is blank, LocalAdminSeeder fails fast at startup
# with a clear local-only configuration error instead of silently skipping.
local.admin.login-id=${LOCAL_ADMIN_LOGIN_ID:}
local.admin.password=${LOCAL_ADMIN_PASSWORD:}
local.admin.name=${LOCAL_ADMIN_NAME:}

# Local-only student seed. Disabled by default, so existing local setups without these values are
# unaffected. When LOCAL_STUDENT_SEED_ENABLED=true, LocalStudentSeeder requires the other three values
# and fails fast at startup if any is blank, matching LocalAdminSeeder's fail-fast behavior.
local.student.seed-enabled=${LOCAL_STUDENT_SEED_ENABLED:false}
local.student.login-id=${LOCAL_STUDENT_LOGIN_ID:}
local.student.password=${LOCAL_STUDENT_PASSWORD:}
local.student.name=${LOCAL_STUDENT_NAME:}
